<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sprig is a calm, beautifully designed financial literacy journey for younger teenagers who are curious about money. UK-based throughout — pounds, VAT, FSCS and the Bank of England. Learn money, one branch at a time." />

    <link rel="canonical" href="https://sprig.education/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sprig" />
    <meta property="og:url" content="https://sprig.education/" />
    <!-- These two deliberately diverge from <title> and meta description
         above, and should stay diverged. Those two are read by search engines,
         where the page needs to be findable and to say what it is. These are
         read by WhatsApp, LinkedIn and Slack, where a link arrives beside a
         picture with no query behind it and has a sentence or two to be worth
         opening. Same page, different jobs. -->
    <meta property="og:title" content="Sprig — a field guide to money" />
    <meta property="og:description" content="Free, anonymous financial literacy for younger teenagers. Short lessons, real scenarios, no exams — grown one small step at a time." />

    <!-- Absolute URL, not /og-image.png: every scraper fetches this from its
         own servers with no page context, so a relative path resolves against
         nothing and the card renders blank. Width and height are declared so
         the card reserves the right shape before the image arrives, which is
         what stops the first render flashing at the wrong aspect ratio. -->
    <meta property="og:image" content="https://sprig.education/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- summary_large_image, upgraded from summary: `summary` renders a small
         square thumbnail and would crop a 1200x630 card to its middle. There
         must be exactly ONE twitter:card tag -- a second one with a different
         value does not override the first, it just makes the result depend on
         which a given crawler reads. -->
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
    />
    <title>Sprig Education</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
